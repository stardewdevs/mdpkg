[package]
name = "mpkg"
version = "1.16.0"
edition = "2021"
authors = ["Stardewdevs"]
description = "Modern package manager for Stardew"
license = "Apache-2.0"
repository = "https://github.com/stardewdevs/mdpkg"
homepage = "https://github.com/stardewdevs/mdpkg"
documentation = "https://github.com/stardewdevs/mdpkg/docs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
colored = "2.1"
env_logger = "0.11"
log = "0.4"
walkdir = "2"
tempfile = "3"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1.0"
tar = "0.4"
indicatif = "0.17"
